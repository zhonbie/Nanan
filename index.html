<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Aura 安全验证中心 | 极核服务器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            font-family: 'Segoe UI', 'Poppins', 'SF Pro Text', system-ui, -apple-system, 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .glass-container {
            max-width: 520px;
            width: 100%;
            background: rgba(12, 18, 28, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .panel {
            padding: 32px 28px 40px;
            transition: opacity 0.25s ease, transform 0.2s ease;
        }
        .hidden-panel {
            display: none;
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #aaaaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .brand p {
            color: #8e9bb5;
            font-size: 14px;
            margin-top: 8px;
        }

        /* 液态玻璃 - 卡密区域 */
        .input-group {
            margin: 20px 0 16px;
            padding: 20px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }
        .input-group::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(180, 200, 255, 0.04), transparent);
            animation: liquidFlow 6s linear infinite;
            z-index: 0;
        }
        @keyframes liquidFlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 60px;
            padding: 16px 24px;
            font-size: 18px;
            color: white;
            font-weight: 500;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .input-field:focus {
            border-color: rgba(255, 180, 70, 0.6);
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 20px rgba(255, 180, 70, 0.25);
        }

        /* 所有按钮统一液态玻璃 */
        .btn, .modal-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 60px;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
        }
        .btn:hover, .modal-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .btn:active, .modal-btn:active {
            transform: scale(0.97);
        }
        .modal-btn {
            width: auto;
            padding: 8px 28px;
            font-size: 16px;
        }

        .error-msg {
            color: #ff8a7a;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            background: rgba(255, 60, 30, 0.15);
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
            width: auto;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 2;
        }

        /* 加载面板 液态玻璃 */
        .loader-area {
            text-align: center;
            margin: 30px 0;
            padding: 24px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .status-text {
            color: #cad2ff;
            font-weight: 500;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .rainbow-bar {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .rainbow-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ffb347, #3eff9e, #4ad4ff, #b76eff);
            background-size: 200% 100%;
            border-radius: 20px;
            transition: width 0.08s linear;
            box-shadow: 0 0 6px #ffb347;
        }
        .loading-sub {
            color: #9aa4c2;
            font-size: 14px;
        }

        /* 扫脸面板 液态玻璃 */
        .face-scan-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0 30px;
            padding: 28px 20px;
            border-radius: 36px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
        }
        .scan-icon {
            position: relative;
            width: 140px;
            height: 140px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
            margin-bottom: 28px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .face-logo {
            font-size: 68px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }
        .scan-line {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 3px;
            background: #3eff9e;
            box-shadow: 0 0 12px #00ffaa;
            border-radius: 4px;
            animation: scanMove 1.2s infinite ease-in-out;
        }
        @keyframes scanMove {
            0% { width: 0%; left: 50%; opacity: 0.6; transform: translateX(-50%);}
            30% { width: 70%; left: 50%; opacity: 1;}
            100% { width: 100%; left: 50%; opacity: 0.8; transform: translateX(-50%);}
        }
        .scan-text {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #e0eaff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .scan-badge {
            margin-top: 10px;
            font-size: 14px;
            color: #ffcd94;
        }

        /* 下载弹窗样式（居中玻璃弹窗） */
        .download-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }
        .download-modal.show {
            visibility: visible;
            opacity: 1;
        }
        .download-card {
            width: 300px;
            background: rgba(20, 25, 35, 0.85);
            backdrop-filter: blur(25px);
            border-radius: 36px;
            padding: 36px 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .download-card h3 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 24px;
            font-weight: 600;
        }
        .download-link-btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(95deg, #3eff9e, #4ad4ff);
            border: none;
            border-radius: 60px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: bold;
            color: #000;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .close-download-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            cursor: pointer;
        }

        /* 全新最终界面 */
        .final-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            min-height: 300px;
            padding: 40px 20px;
        }
        .final-btn {
            width: 80%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff;
            padding: 16px 0;
            border-radius: 60px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .start-btn {
            background: linear-gradient(95deg, #4ad4ff, #b76eff);
            color: #fff;
        }

        /* 原有弹窗 */
        .custom-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .custom-modal.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: rgba(20, 25, 35, 0.85);
            backdrop-filter: blur(25px);
            border-radius: 44px;
            padding: 28px 24px;
            width: 280px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
        }
        .modal-card p {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .silence-circle {
            position: fixed;
            top: 32px;
            left: 28px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #2c2418, #1c170e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 120;
            box-shadow: 0 0 0 4px #ffd966, 0 0 0 8px rgba(255, 215, 0, 0.4);
            transition: 0.2s;
            opacity: 0;
            transform: scale(0.7);
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
        .silence-circle.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            animation: goldenPulse 1.2s infinite;
        }
        @keyframes goldenPulse {
            0% { box-shadow: 0 0 0 4px #ffd966, 0 0 0 8px rgba(255, 215, 0, 0.4);}
            50% { box-shadow: 0 0 0 6px #ffbd33, 0 0 0 12px rgba(255, 200, 0, 0.6);}
            100% { box-shadow: 0 0 0 4px #ffd966, 0 0 0 8px rgba(255, 215, 0, 0.4);}
        }
        .silence-circle span {
            font-size: 28px;
            font-weight: 800;
            color: #FFD966;
            text-shadow: 0 0 3px #ffb347;
            letter-spacing: 2px;
            font-family: monospace;
        }
        .reset-hint {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 60px;
            font-size: 12px;
            color: #ccc;
            cursor: pointer;
            z-index: 200;
            backdrop-filter: blur(5px);
            font-weight: 500;
        }
        footer {
            text-align: center;
            font-size: 11px;
            color: #5d6a82;
            margin-top: 18px;
        }
    </style>
</head>
<body>

<!-- 下载弹窗 -->
<div id="downloadModal" class="download-modal">
    <div class="download-card">
        <h3>验证完成</h3>
        <a href="https://www.ilanzou.com/s/SUQmvRGK" target="_blank" class="download-link-btn">立即下载</a>
        <button id="closeDownload" class="close-download-btn">关闭</button>
    </div>
</div>

<div class="glass-container">
    <!-- 步骤1: 输入卡密界面 -->
    <div id="panelInput" class="panel">
        <div class="brand">
            <h1>⚡ Aura 极核服务器</h1>
            <p>安全接入 · 动态卡网验证</p>
        </div>
        <div class="input-group">
            <input type="text" id="cardInput" class="input-field" placeholder="输入卡密 / 特权代码" autocomplete="off">
            <button id="submitCardBtn" class="btn">验证卡网 ▸</button>
        </div>
        <div id="inputErrorMsg" class="error-msg" style="display: none;">❌ 卡密错误，请重试</div>
        <footer>Aura 专属通道 · 动态加密</footer>
    </div>

    <!-- 步骤2: 加载界面 -->
    <div id="panelLoading" class="panel hidden-panel">
        <div class="brand">
            <h1>⏳ 安全检测中</h1>
            <p>Aura 光环</p>
        </div>
        <div class="loader-area">
            <div class="status-text">🔐 正在检测卡密是否正确</div>
            <div class="rainbow-bar">
                <div id="rainbowFill" class="rainbow-fill"></div>
            </div>
            <div class="loading-sub">加密协议握手 • 量子校验中</div>
        </div>
        <footer>请勿关闭页面 • 服务器安全认证</footer>
    </div>

    <!-- 步骤3: 面容扫描 -->
    <div id="panelFaceScan" class="panel hidden-panel">
        <div class="brand">
            <h1>📱 Face ID 镜像</h1>
            <p>仿生扫描 · 活体检测</p>
        </div>
        <div class="face-scan-area">
            <div class="scan-icon" id="scanIconBox">
                <div class="face-logo">👤</div>
                <div id="scanLineAnim" class="scan-line" style="display: block;"></div>
            </div>
            <div class="scan-text" id="scanStatusText">正在扫描安全</div>
            <div class="scan-badge">Aura 面容模组</div>
        </div>
        <footer>保持面部在框内 · 环境光匹配</footer>
    </div>

    <!-- 🔥 全新最终界面：下载+开始 双按钮居中 -->
    <div id="panelFinal" class="panel hidden-panel">
        <div class="brand">
            <h1>⚡ Aura 极核</h1>
            <p>验证已全部完成</p>
        </div>
        <div class="final-box">
            <a href="https://www.ilanzou.com/s/SUQmvRGK" target="_blank" class="final-btn">下载文件</a>
            <button class="final-btn start-btn">开始使用</button>
        </div>
        <footer>Aura · 安全验证完成</footer>
    </div>
</div>

<div id="silenceGoldCircle" class="silence-circle">
    <span>难安</span>
</div>
<div id="resetBtn" class="reset-hint">⟳ 重置流程</div>

<div id="globalModal" class="custom-modal">
    <div class="modal-card">
        <p id="modalMessage">消息</p>
        <button id="modalConfirmBtn" class="modal-btn">确认</button>
    </div>
</div>

<script>
    const panelInput = document.getElementById('panelInput');
    const panelLoading = document.getElementById('panelLoading');
    const panelFaceScan = document.getElementById('panelFaceScan');
    const panelFinal = document.getElementById('panelFinal');
    const submitBtn = document.getElementById('submitCardBtn');
    const cardInput = document.getElementById('cardInput');
    const inputError = document.getElementById('inputErrorMsg');
    const rainbowFill = document.getElementById('rainbowFill');
    const silenceCircle = document.getElementById('silenceGoldCircle');
    const resetEl = document.getElementById('resetBtn');
    const globalModal = document.getElementById('globalModal');
    const modalMessageSpan = document.getElementById('modalMessage');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');
    const downloadModal = document.getElementById('downloadModal');
    const closeDownload = document.getElementById('closeDownload');
    const CUSTOM_WEBSITE = "https://www.ilanzou.com/s/SUQmvRGK";

    let loadingInterval = null;
    let scanTimer = null;
    let isScanCompleted = false;
    let isSilenceAlreadyCreated = false;
    let currentStep = 'input';

    // 打开下载弹窗
    function openDownloadModal() {
        downloadModal.classList.add('show');
    }
    // 关闭下载弹窗 → 跳转到最终界面
    closeDownload.onclick = () => {
        downloadModal.classList.remove('show');
        showFinalPanel();
    };

    function showSmallModal(message, onConfirm) {
        modalMessageSpan.innerText = message;
        globalModal.classList.add('active');
        const confirmHandler = () => {
            globalModal.classList.remove('active');
            modalConfirmBtn.removeEventListener('click', confirmHandler);
            if (onConfirm && typeof onConfirm === 'function') onConfirm();
        };
        modalConfirmBtn.addEventListener('click', confirmHandler, { once: true });
    }

    function clearAllTimeoutsAndIntervals() {
        if (loadingInterval) clearInterval(loadingInterval);
        if (scanTimer) clearTimeout(scanTimer);
    }

    function showPanel(panelName) {
        panelInput.classList.add('hidden-panel');
        panelLoading.classList.add('hidden-panel');
        panelFaceScan.classList.add('hidden-panel');
        panelFinal.classList.add('hidden-panel');
        if (panelName === 'input') panelInput.classList.remove('hidden-panel');
        else if (panelName === 'loading') panelLoading.classList.remove('hidden-panel');
        else if (panelName === 'facescan') panelFaceScan.classList.remove('hidden-panel');
        else if (panelName === 'final') panelFinal.classList.remove('hidden-panel');
        currentStep = panelName;
    }

    // 显示最终界面
    function showFinalPanel() {
        showPanel('final');
    }

    function handleCardSubmit() {
        if (currentStep !== 'input') return;
        const inputCode = cardInput.value.trim();
        if (inputCode === "Aura" || inputCode === "aura") {
            inputError.style.display = 'none';
            showPanel('loading');
            startLoadingAnimationAndCheck();
        } else {
            inputError.style.display = 'block';
            inputError.innerText = '❌ 卡密错误，正确卡密：Aura / aura';
        }
    }

    function startLoadingAnimationAndCheck() {
        let width = 0;
        rainbowFill.style.width = '0%';
        const totalDuration = 1800;
        const stepTime = 20;
        const incrementPerStep = 100 / (totalDuration / stepTime);
        loadingInterval = setInterval(() => {
            if (width >= 100) {
                clearInterval(loadingInterval);
                showSmallModal("🎉 恭喜卡密正确", () => {
                    showPanel('facescan');
                    startFaceScanProcess();
                });
                return;
            }
            width += incrementPerStep;
            rainbowFill.style.width = width + '%';
        }, stepTime);
    }

    function startFaceScanProcess() {
        isScanCompleted = false;
        isSilenceAlreadyCreated = false;
        silenceCircle.classList.remove('show');
        const scanLine = document.getElementById('scanLineAnim');
        const scanStatusSpan = document.getElementById('scanStatusText');
        scanLine.style.display = 'block';
        scanStatusSpan.innerText = '正在扫描安全';
        scanTimer = setTimeout(() => {
            scanLine.style.display = 'none';
            scanStatusSpan.innerText = '✅ 扫描安全通过';
            isScanCompleted = true;
            showSmallModal("🔒 扫描安全完成 · 生物特征匹配", () => {
                if (!isSilenceAlreadyCreated) {
                    isSilenceAlreadyCreated = true;
                    silenceCircle.classList.add('show');
                }
                openDownloadModal();
            });
        }, 2000);
    }

    silenceCircle.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isScanCompleted && silenceCircle.classList.contains('show')) {
            showSmallModal("所遇难安，所安难遇\n「深空之寂」", () => {});
        }
    });

    function resetAllProcess() {
        clearAllTimeoutsAndIntervals();
        isScanCompleted = false;
        isSilenceAlreadyCreated = false;
        silenceCircle.classList.remove('show');
        downloadModal.classList.remove('show');
        showPanel('input');
        cardInput.value = '';
        inputError.style.display = 'none';
        rainbowFill.style.width = '0%';
        const scanLine = document.getElementById('scanLineAnim');
        scanLine.style.display = 'block';
        const scanStatusSpan = document.getElementById('scanStatusText');
        scanStatusSpan.innerText = '正在扫描安全';
        globalModal.classList.remove('active');
    }

    function initEventListeners() {
        submitBtn.addEventListener('click', handleCardSubmit);
        resetEl.addEventListener('click', resetAllProcess);
        cardInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleCardSubmit();
        });
    }

    window.addEventListener('load', () => {
        initEventListeners();
        silenceCircle.classList.remove('show');
        downloadModal.classList.remove('show');
        globalModal.classList.remove('active');
    });
</script>
</body>
</html>
